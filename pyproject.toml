[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oddsmodel"
version = "0.1.0"
description = "Probabilistic modelling of sports odds markets: de-vigging, market consensus and mispricing detection"
authors = [{ name = "Karan Randhawa" }]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31", "pandas>=2.0", "numpy>=1.24", "python-dotenv>=1.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
